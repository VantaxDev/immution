name: ubuntu-integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apache-mod-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Install Apache and PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 libapache2-mod-php php-cli curl logrotate
          sudo systemctl start apache2

      - name: Run source checks
        run: ./scripts/check-release.sh

      - name: Existing auto_prepend_file stops before changes
        run: |
          printf '%s\n' '<?php // existing application bootstrap' > /tmp/existing-prepend.php
          for conf_dir in /etc/php/*/apache2/conf.d; do
            printf '%s\n' 'auto_prepend_file = /tmp/existing-prepend.php' \
              | sudo tee "$conf_dir/98-existing-prepend.ini" >/dev/null
          done
          set +e
          output="$(sudo ./scripts/install.sh 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'Existing auto_prepend_file configuration detected' <<<"$output"
          test ! -e /opt/immution
          test ! -e /etc/systemd/system/immution.service
          sudo rm -f /etc/php/*/apache2/conf.d/98-existing-prepend.ini
          sudo apache2ctl configtest

      - name: Fresh monitor-mode installation
        run: |
          sudo ./scripts/install.sh
          sudo systemctl is-active --quiet immution
          test "$(systemctl show immution -p User --value)" = immution
          pid="$(systemctl show immution -p MainPID --value)"
          test "$(ps -o user= -p "$pid" | xargs)" = immution
          test "$(stat -c '%a' /run/immution)" = 750
          test "$(stat -c '%U:%G' /run/immution)" = immution:www-data
          sudo grep -q "'mode' => 'monitor'" /etc/immution/gate-config.php
          sudo apache2ctl configtest
          sudo systemctl restart apache2
          sudo systemctl is-active --quiet apache2

      - name: Monitor, unblock and block behavior
        run: |
          fail() {
            printf 'FAIL: %s\n' "$1" >&2
            printf '%s\n' '--- response body ---' >&2
            test ! -f /tmp/immution-body || sudo sed -n '1,80p' /tmp/immution-body >&2
            printf '%s\n' '--- Immution events ---' >&2
            sudo test ! -f /var/log/immution/events.csv || sudo tail -n 20 /var/log/immution/events.csv >&2
            printf '%s\n' '--- Apache access log ---' >&2
            sudo test ! -f /var/log/apache2/access.log || sudo tail -n 20 /var/log/apache2/access.log >&2
            printf '%s\n' '--- Immution service ---' >&2
            sudo systemctl --no-pager --full status immution >&2 || true
            exit 1
          }

          printf '%s\n' '<?php echo $_SERVER["REMOTE_ADDR"];' \
            | sudo tee /var/www/html/immution-client-ip.php >/dev/null
          server_ip="$(hostname -I | awk '{print $1}')"
          client_ip="$(curl --noproxy '*' -fsS "http://$server_ip/immution-client-ip.php")"
          python3 -c 'import ipaddress,sys; ipaddress.ip_address(sys.argv[1])' "$client_ip" \
            || fail "PHP returned an invalid REMOTE_ADDR: $client_ip"
          test "$client_ip" != 127.0.0.1 && test "$client_ip" != ::1 \
            || fail "The integration request reached Apache through loopback"

          state_name="${client_ip//:/_}.json"
          now="$(date +%s)"
          printf '%s\n' '<?php echo "ORIGIN_OK";' \
            | sudo tee /var/www/html/immution-test.php >/dev/null

          seed_state() {
            printf '{"score":100,"banned":true,"requests":0,"errors_404":3,"probes":3,"updated":%s,"last_score_ts":%s,"reasons":["test probe"]}\n' "$now" "$now" > /tmp/immution-test-state.json
            sudo install -o immution -g www-data -m 0640 \
              /tmp/immution-test-state.json "/run/immution/$state_name"
          }

          seed_state
          status="$(curl --noproxy '*' -sS -o /tmp/immution-body -w '%{http_code}' \
            "http://$server_ip/immution-test.php")"
          test "$status" = 200 || fail "monitor mode returned HTTP $status instead of 200"
          grep -q ORIGIN_OK /tmp/immution-body || fail "monitor mode did not execute the application"
          sudo grep -q would_block /var/log/immution/events.csv \
            || fail "monitor mode did not log would_block"

          for _ in {1..20}; do
            requests="$(sudo python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["requests"])' "/run/immution/$state_name")"
            [[ "$requests" -gt 0 ]] && break
            sleep 0.25
          done
          test "$requests" -gt 0 || fail "the daemon did not process Apache's request log"
          test "$(sudo stat -c '%a' "/run/immution/$state_name")" = 640 \
            || fail "the state file does not have mode 0640"

          sudo /opt/immution/immutionctl.py explain "$client_ip"
          sudo /opt/immution/immutionctl.py unblock "$client_ip"
          sudo test ! -e "/run/immution/$state_name"
          curl --noproxy '*' -fsS "http://$server_ip/immution-test.php" | grep -q ORIGIN_OK
          sleep 1
          sudo test ! -e "/run/immution/$state_name" \
            || fail "the daemon recreated state immediately after unblock"

          printf '%s\n' '{"score":60,"banned":true,"reasons":["IPv6 test"]}' > /tmp/immution-ipv6-state.json
          sudo install -o immution -g www-data -m 0640 \
            /tmp/immution-ipv6-state.json /run/immution/2001_db8__40.json
          sudo /opt/immution/immutionctl.py explain 2001:db8::40
          sudo /opt/immution/immutionctl.py unblock 2001:db8::40

          sudo sed -i "s/'mode' => 'monitor'/'mode' => 'block'/" /etc/immution/gate-config.php
          sudo systemctl reload apache2
          now="$(date +%s)"
          seed_state
          status="$(curl --noproxy '*' -sS -o /tmp/immution-body -w '%{http_code}' \
            "http://$server_ip/immution-test.php")"
          test "$status" = 403 || fail "block mode returned HTTP $status instead of 403"
          ! grep -q ORIGIN_OK /tmp/immution-body || fail "block mode executed the application"
          grep -q 'Access temporarily limited' /tmp/immution-body \
            || fail "the 403 response did not contain Immution's block page"
          sudo grep -q ',blocked,' /var/log/immution/events.csv \
            || fail "block mode did not log blocked"

      - name: Upgrade preserves block mode and failure restores files
        run: |
          sudo ./scripts/install.sh | tee /tmp/immution-upgrade-output
          grep -q 'Configured mode: block' /tmp/immution-upgrade-output
          sudo cp /etc/immution/gate-config.php /tmp/immution-before-config
          sudo cp /opt/immution/gate.php /tmp/immution-before-gate
          mkdir -p /tmp/immution-fail-bin
          cat > /tmp/immution-fail-bin/systemctl <<'SH'
          #!/usr/bin/env bash
          # Inject failure only at restart; rollback may still start the unit.
          if [[ "$1" == restart && "${2:-}" == immution ]]; then
            exit 1
          fi
          exec /usr/bin/systemctl "$@"
          SH
          chmod +x /tmp/immution-fail-bin/systemctl
          if sudo env PATH="/tmp/immution-fail-bin:$PATH" ./scripts/install.sh; then
            echo 'FAIL: injected restart failure was ignored' >&2
            exit 1
          fi
          sudo cmp /tmp/immution-before-config /etc/immution/gate-config.php
          sudo cmp /tmp/immution-before-gate /opt/immution/gate.php
          sudo systemctl is-active --quiet immution
          sudo apache2ctl configtest

      - name: Rotate the PHP event log
        run: |
          sudo logrotate -f /etc/logrotate.d/immution
          sudo test -f /var/log/immution/events.csv.1
          test "$(sudo stat -c '%a' /var/log/immution/events.csv)" = 640

      - name: Uninstall leaves Apache healthy
        run: |
          sudo ./scripts/uninstall.sh --purge
          sudo systemctl restart apache2
          sudo systemctl is-active --quiet apache2
          test ! -e /opt/immution
          test ! -e /etc/systemd/system/immution.service
          test ! -e /etc/immution
          test ! -e /run/immution
          if find /etc/php -path '*/apache2/conf.d/99-immution.ini' -print -quit | grep -q .; then
            exit 1
          fi
          server_ip="$(hostname -I | awk '{print $1}')"
          curl --noproxy '*' -fsS "http://$server_ip/immution-test.php" | grep -q ORIGIN_OK
